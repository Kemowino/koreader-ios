name: Build KOReader iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout koreader-ios with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install required KOReader iOS build tools
        run: |
          brew install autoconf automake bash binutils cmake coreutils findutils \
            gettext gnu-getopt gnu-sed libtool make meson nasm ninja pkgconf \
            sdl3 util-linux xcodegen

          BREW_PREFIX="$(brew --prefix)"
          echo "${BREW_PREFIX}/opt/make/libexec/gnubin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/findutils/libexec/gnubin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/coreutils/libexec/gnubin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/gnu-getopt/bin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/util-linux/bin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/binutils/bin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/gettext/bin" >> $GITHUB_PATH

      - name: Download and bundle Syncery plugin
        run: |
          git clone https://github.com/d0nizam/syncery.koplugin.git plugins/syncery.koplugin
          rm -rf plugins/syncery.koplugin/.git

      - name: Build host LuaJIT and generate Xcode project
        run: |
          make TARGET=macos base
          make TARGET=ios xcodeproj

      - name: Compile unsigned iOS .app and package .ipa
        run: |
          xcodebuild -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_out \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          APP_PATH=$(find build_out -name "KOReader.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -qr KOReader-Syncery.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOReader-Syncery-IPA
          path: KOReader-Syncery.ipa
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
